<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robosec</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#14202b;--muted:#586674;--line:#d9e0e7;--accent:#0a6c70;--accent-soft:#dff0f0;
--stop:#b3261e;--stop-soft:#fdeceb;--warn:#7a5200;--warn-soft:#fff3d3;--ok:#1b7a4a;--ok-soft:#e3f4ea;--code:#eef2f5;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e141a;--surface:#151d25;--ink:#e5ebf1;--muted:#98a6b4;--line:#26323d;
--accent:#4fc3c6;--accent-soft:#12303a;--stop:#ff8f86;--stop-soft:#3a1e1c;--warn:#f0c46c;--warn-soft:#31280f;--ok:#62d49b;
--ok-soft:#12301f;--code:#1b252f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding:16px}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:16px}h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 8px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid var(--line);font:12px var(--mono)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.stop{color:var(--stop);border-color:var(--stop);background:var(--stop-soft)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--code);position:sticky;top:0}
.scroll{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:6px}td.m{font-family:var(--mono);font-size:12px;word-break:break-all}
input,select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div><h1>Robosec</h1><div class="muted">What leaves the robot, and what you allow</div></div>
    <div class="row"><input id="tok" type="password" placeholder="admin token" size="22"><button id="go" class="primary">Connect</button>
      <span id="mode" class="pill">not connected</span><span id="learn" class="pill"></span></div>
  </div>
  <div id="err" class="card" hidden style="border-color:var(--stop);color:var(--stop)"></div>
  <div class="grid">
    <div class="card"><h2>Computers</h2><div class="scroll"><table id="hosts"></table></div></div>
    <div class="card"><h2>Policy</h2>
      <div class="row"><label>Mode <select id="p-mode"><option>observe</option><option>enforce</option></select></label>
        <label>Unclassified internet <select id="p-def"><option>allow</option><option>block</option></select></label></div>
      <div class="scroll" style="margin-top:8px"><table id="p-cats"></table></div>
      <div class="row" style="margin-top:8px"><button id="p-save" class="primary">Save policy</button>
        <span class="muted" id="p-msg"></span></div>
      <p class="muted" style="margin:8px 0 0">Observe never blocks. Enforce drops blocked categories at the gateway only.</p></div>
  </div>
  <div class="grid">
    <div class="card"><h2>Internet destinations by category</h2><div class="scroll"><table id="cats"></table></div></div>
    <div class="card"><h2>Alerts <span id="nalerts" class="pill"></span></h2><div class="scroll"><table id="alerts"></table></div></div>
  </div>
  <div class="card"><h2>Connections</h2>
    <div class="row" style="margin-bottom:8px"><select id="f-scope"><option value="internet">internet</option><option value="">all scopes</option>
      <option>lan</option><option>vpn</option><option>robot</option></select>
      <select id="f-host"><option value="">all computers</option></select><input id="f-q" placeholder="filter process / address">
      <button id="f-go">Refresh</button></div>
    <div class="scroll"><table id="edges"></table></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let TOKEN="";try{TOKEN=sessionStorage.getItem("robosec")||""}catch(e){}
const fmt=t=>t?new Date(t*1000).toLocaleString():"";const mb=b=>b>1e6?(b/1e6).toFixed(1)+" MB":b>1e3?(b/1e3).toFixed(1)+" kB":(b||0)+" B";
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"}});
 if(!r.ok)throw new Error(path+" -> "+r.status+" "+(await r.text()).slice(0,120));return r.json()}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rows(el,head,data){el.innerHTML="<tr>"+head.map(h=>"<th>"+h+"</th>").join("")+"</tr>"+data.map(r=>"<tr>"+r.map(c=>"<td"+(c&&c.m?' class="m"':"")+">"+(c&&c.h!==undefined?c.h:esc(c&&c.v!==undefined?c.v:c))+"</td>").join("")+"</tr>").join("")}
let POLICY=null,CATS=[];
async function load(){
 try{$("err").hidden=true;const s=await api("/api/v1/summary");POLICY=s.policy;CATS=(await api("/api/v1/categories")).categories;
  $("mode").textContent=s.policy.mode;$("mode").className="pill "+(s.policy.mode==="enforce"?"stop":"ok");
  $("learn").textContent=s.learning?"learning until "+fmt(s.learning_ends):"alerts on";$("learn").className="pill "+(s.learning?"warn":"ok");
  rows($("hosts"),["host","last seen","agent","sample ms","unattributed"],s.hosts.map(h=>[h.host,fmt(h.last_seen),h.agent_version,h.stats.sample_ms,h.stats.unattributed]));
  rows($("cats"),["category","edges","destinations","bytes sent"],s.internet_categories.map(c=>[c.category,c.edges,c.destinations,mb(c.bytes_sent)]));
  const sel=$("f-host");const cur=sel.value;sel.innerHTML='<option value="">all computers</option>'+s.hosts.map(h=>"<option>"+esc(h.host)+"</option>").join("");sel.value=cur;
  $("p-mode").value=s.policy.mode;$("p-def").value=s.policy.default_internet;
  const ids=[...new Set([...CATS.map(c=>c.id),"unclassified"])];
  $("p-cats").innerHTML="<tr><th>category</th><th>risk</th><th>verdict</th></tr>"+ids.map(id=>{const c=CATS.find(x=>x.id===id)||{};const v=(s.policy.categories||{})[id]||"allow";
   return `<tr><td>${esc(c.label||id)}<div class="muted m">${esc(id)}</div></td><td>${esc(c.risk||"")}</td><td><select data-cat="${esc(id)}"><option ${v==="allow"?"selected":""}>allow</option><option ${v==="block"?"selected":""}>block</option></select></td></tr>`}).join("");
  const al=(await api("/api/v1/alerts")).alerts;$("nalerts").textContent=s.open_alerts+" open";$("nalerts").className="pill "+(s.open_alerts?"warn":"ok");
  rows($("alerts"),["time","computer","what","",""],al.slice(0,60).map(a=>[fmt(a.ts),a.host,{v:a.kind+": "+a.detail,m:1},a.acked?"acked":{h:`<button data-ack="${a.id}">Ack</button>`},""]));
  await edges()}catch(e){$("err").hidden=false;$("err").textContent=e.message}}
async function edges(){const q=new URLSearchParams();if($("f-scope").value)q.set("scope",$("f-scope").value);if($("f-host").value)q.set("host",$("f-host").value);if($("f-q").value)q.set("q",$("f-q").value);q.set("limit","400");
 const e=(await api("/api/v1/edges?"+q)).edges;rows($("edges"),["computer","dir","process","dest","proto","scope","category","seen","last","bytes to dest"],e.map(x=>[x.host,x.dir,{v:x.exe,m:1},{v:x.raddr+":"+x.rport,m:1},x.proto,x.scope,x.category,x.count,fmt(x.last_seen),mb(x.bytes_to_dest)]))}
$("go").onclick=()=>{TOKEN=$("tok").value;try{sessionStorage.setItem("robosec",TOKEN)}catch(e){}load()};
$("f-go").onclick=()=>edges().catch(e=>{$("err").hidden=false;$("err").textContent=e.message});
$("p-save").onclick=async()=>{const cats={};document.querySelectorAll("[data-cat]").forEach(s=>cats[s.dataset.cat]=s.value);
 try{await api("/api/v1/policy",{method:"PUT",body:JSON.stringify({mode:$("p-mode").value,default_internet:$("p-def").value,categories:cats})});$("p-msg").textContent="saved "+new Date().toLocaleTimeString();load()}catch(e){$("p-msg").textContent=e.message}};
document.addEventListener("click",async e=>{const id=e.target.dataset&&e.target.dataset.ack;if(id){await api("/api/v1/alerts/"+id+"/ack",{method:"POST",body:"{}"});load()}});
if(TOKEN){$("tok").value=TOKEN;load();setInterval(load,15000)}
</script>
</body>
</html>
